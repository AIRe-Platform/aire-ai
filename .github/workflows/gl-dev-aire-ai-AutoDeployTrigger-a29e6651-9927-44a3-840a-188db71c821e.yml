name: Trigger auto deployment for gl-dev-aire-ai

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ staging ]
    paths:
    - '**'
    - '.github/workflows/gl-dev-aire-ai-AutoDeployTrigger-a29e6651-9927-44a3-840a-188db71c821e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.GLDEVAIREAI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GLDEVAIREAI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GLDEVAIREAI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }} 
          registryUrl: airecontainers.azurecr.io
          registryUsername: ${{ secrets.GLDEVAIREAI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GLDEVAIREAI_REGISTRY_PASSWORD }}
          containerAppName: gl-dev-aire-ai
          resourceGroup: AireDevelopment
          imageToBuild: airecontainers.azurecr.io/gl-dev-aire-ai:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


